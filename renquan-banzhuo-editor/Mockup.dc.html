<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ bandanaFlat }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:440px;height:440px">
  <div style="position:absolute;left:20px;top:20px;width:400px;height:400px;transform:rotate(-4deg);box-shadow:0 24px 36px -18px rgba(90,20,50,.5),0 3px 6px rgba(90,20,50,.18);background:#fff;overflow:hidden">
    <img src="assets/bandana_v2.webp" alt="方巾原稿" style="position:absolute;left:0;top:0;width:100%;height:100%;display:block">
    <div style="position:absolute;inset:0;background-image:url(assets/noise.svg);mix-blend-mode:multiply;opacity:.32"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.2) 40%,rgba(255,255,255,0) 52%),linear-gradient(200deg,rgba(0,0,0,0) 55%,rgba(70,10,35,.07) 67%,rgba(0,0,0,0) 80%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(0,0,0,.05))"></div>
    <div style="position:absolute;inset:7px;border:1.5px dashed rgba(150,50,90,.3)"></div>
  </div>
</div>
</sc-if>
<sc-if value="{{ bandanaFolded }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:300px;height:300px">

  <div style="position:absolute;left:30px;top:30px;width:240px;height:240px;transform:translate(5px,7px) rotate(3deg);background:#D892AC"></div>
  <div style="position:absolute;left:30px;top:30px;width:240px;height:240px;transform:translate(2px,3px) rotate(3deg);background:#E3A2BA"></div>
  <div style="position:absolute;left:30px;top:30px;width:240px;height:240px;transform:rotate(3deg);overflow:hidden;background:#fff">
    <img src="assets/bandana_v2.webp" alt="方巾摺疊" style="position:absolute;left:-120px;top:-120px;width:480px;height:480px;display:block">
    <div style="position:absolute;inset:0;background-image:url(assets/noise.svg);mix-blend-mode:multiply;opacity:.32"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)"></div>
    <div style="position:absolute;inset:0;box-shadow:inset 0 0 14px rgba(120,30,60,.28),inset 0 0 2px rgba(120,30,60,.35)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%,rgba(0,0,0,.06))"></div>
  </div>
</div>
</sc-if>
<sc-if value="{{ towelFlat }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:600px;height:240px">

  </div>
</div>
</sc-if>
<sc-if value="{{ towelFolded }}" hint-placeholder-val="{{ false }}">

</sc-if>
<sc-if value="{{ penMain }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:640px;height:110px">

<sc-if value="{{ pensTrio }}" hint-placeholder-val="{{ false }}">

<sc-if value="{{ penDetail }}" hint-placeholder-val="{{ false }}">

</div>
</sc-if>
<sc-if value="{{ socks }}" hint-placeholder-val="{{ false }}">

  <img src="assets/socks_front_v2.webp" alt="中筒襪設計稿（正面）" style="width:132px;height:550px;object-fit:contain;display:block;filter:drop-shadow(0 14px 14px rgba(90,20,50,.25))">

<sc-if value="{{ tee }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:440px;height:460px">
  <img src="{{ teeSrc }}" alt="{{ teeAlt }}" style="position:absolute;left:0;top:44px;width:440px;height:auto;display:block;filter:drop-shadow(0 20px 18px rgba(40,60,30,.28))">
</div>
</sc-if>
<sc-if value="{{ socksPair }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:520px;height:440px">

</sc-if>
<sc-if value="{{ sockSingle }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:260px;height:440px">
  <img src="assets/sock_single_v2.webp" alt="中筒襪（單隻）" style="position:absolute;left:0;top:0;width:260px;height:auto;display:block;filter:drop-shadow(0 16px 16px rgba(90,20,50,.28))">

<sc-if value="{{ stickerSheet }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:320px;height:460px">
  <div style="position:absolute;left:20px;top:16px;width:280px;height:412px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 20px 26px -14px rgba(90,20,50,.42),0 2px 4px rgba(90,20,50,.12);transform:rotate(-3deg)">
    <img src="assets/sticker_v2.webp" alt="轉印貼整張" style="position:absolute;left:0;top:0;width:280px;height:412px;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.4) 42%,rgba(255,255,255,0) 54%),linear-gradient(180deg,rgba(0,0,0,0) 70%,rgba(90,20,50,.06))"></div>
    <div style="position:absolute;inset:8px;border:1.5px dashed rgba(150,50,90,.22);border-radius:6px"></div>
  </div>
</div>
</sc-if>
<sc-if value="{{ streamerPair }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:520px;height:300px">
  <img src="assets/streamer_pair_v2.webp" alt="飛行飄帶（正面、背面）" style="position:absolute;left:0;top:37px;width:520px;height:auto;display:block;filter:drop-shadow(0 14px 12px rgba(40,50,50,.3))">
</div>
</sc-if>
<sc-if value="{{ streamerSingle }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:520px;height:150px">
  <img src="assets/streamer_single_v2.webp" alt="飛行飄帶（背面）" style="position:absolute;left:0;top:20px;width:520px;height:auto;display:block;filter:drop-shadow(0 14px 12px rgba(40,50,50,.3))">
</div>
</sc-if>
<sc-if value="{{ ecard }}" hint-placeholder-val="{{ false }}">

  <div style="position:absolute;left:20px;top:214px;width:400px;height:226px;border-radius:10px;background:#D6608A;box-shadow:0 22px 30px -16px rgba(90,20,50,.5)"></div>

    <div style="position:absolute;inset:10px;border:2.5px solid #E8457C;border-radius:10px"></div>
    <div style="position:absolute;inset:16px;border:1.5px dashed rgba(232,69,124,.45);border-radius:6px"></div>

    <div style="position:absolute;left:34px;top:96px;font-family:'Mantou Sans','Noto Sans TC',sans-serif;font-size:46px;line-height:1.08;color:#363A37">謝謝你<br>純粹相挺</div>

    <img src="assets/t/selfie.webp" alt="" style="position:absolute;left:250px;top:96px;height:142px;width:auto">
    <svg viewBox="0 0 24 24" width="22" height="22" style="position:absolute;left:350px;top:40px" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#F2C14E"/></svg>
    <svg viewBox="0 0 24 24" width="14" height="14" style="position:absolute;left:318px;top:70px" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#E8457C"/></svg>
  </div>

  <div style="position:absolute;left:20px;top:272px;width:400px;height:168px;clip-path:polygon(0 0,50% 46%,100% 0,100% 2px,50% calc(46% + 2px),0 2px);background:rgba(255,255,255,.35)"></div>
  <div style="position:absolute;left:186px;top:328px;width:68px;height:68px;border-radius:50%;background:#C24030;box-shadow:0 3px 6px rgba(60,10,20,.35);display:flex;align-items:center;justify-content:center;font-family:Huninn;font-size:22px;color:#fff">謝</div>
</div>

<sc-if value="{{ ecardCard }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;width:460px;height:330px">
  <div style="position:absolute;left:30px;top:30px;width:400px;height:270px;transform:rotate(0deg);border-radius:16px;background:#FFF9F6;box-shadow:0 18px 26px -14px rgba(90,20,50,.45),0 2px 4px rgba(90,20,50,.12);overflow:hidden">
    <div style="position:absolute;inset:10px;border:2.5px solid #E8457C;border-radius:10px"></div>
    <div style="position:absolute;inset:16px;border:1.5px dashed rgba(232,69,124,.45);border-radius:6px"></div>

    <img src="assets/t/logo_pink_warp.webp" alt="人權辦桌" style="position:absolute;left:34px;top:56px;width:104px;height:auto">
    <div style="position:absolute;left:34px;top:96px;font-family:'Mantou Sans','Noto Sans TC',sans-serif;font-size:46px;line-height:1.08;color:#363A37">謝謝你<br>純粹相挺</div>
    <div style="position:absolute;left:36px;top:208px;font-family:Huninn;font-size:15px;line-height:1.4;color:#E8457C">2026 第十一屆人權辦桌<br><span style="color:#7A6E72">jîn-kuân pān-toh</span></div>

    <svg viewBox="0 0 24 24" width="22" height="22" style="position:absolute;left:350px;top:40px" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#F2C14E"/></svg>
    <svg viewBox="0 0 24 24" width="14" height="14" style="position:absolute;left:318px;top:70px" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#E8457C"/></svg>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:440},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bandana-flat&quot;,&quot;bandana-folded&quot;,&quot;towel-flat&quot;,&quot;towel-folded&quot;,&quot;pen-main&quot;,&quot;pen-detail&quot;,&quot;socks&quot;,&quot;tee-pink&quot;,&quot;tee-green&quot;,&quot;socks-pair&quot;,&quot;sock-single&quot;,&quot;sticker-sheet&quot;,&quot;streamer-pair&quot;,&quot;streamer-single&quot;,&quot;tee-back&quot;,&quot;pens-trio&quot;,&quot;ecard&quot;,&quot;ecard-card&quot;],&quot;default&quot;:&quot;bandana-flat&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'bandana-flat';
    return {
      bandanaFlat: k === 'bandana-flat', bandanaFolded: k === 'bandana-folded',
      towelFlat: k === 'towel-flat', towelFolded: k === 'towel-folded',
      penMain: k === 'pen-main', penDetail: k === 'pen-detail', socks: k === 'socks',
      tee: k === 'tee-pink' || k === 'tee-green' || k === 'tee-back',
      teeSrc: k === 'tee-back' ? 'assets/tee_back.webp' : 'assets/tee_front.webp',
      teeAlt: k === 'tee-back' ? 'T-shirt 綠款（背面）' : 'T-shirt 綠款（正面）',
      pensTrio: k === 'pens-trio', ecard: k === 'ecard', ecardCard: k === 'ecard-card',
      socksPair: k === 'socks-pair', sockSingle: k === 'sock-single', stickerSheet: k === 'sticker-sheet', streamerPair: k === 'streamer-pair', streamerSingle: k === 'streamer-single'
    };
  }
}
</script>
</body>
</html>
